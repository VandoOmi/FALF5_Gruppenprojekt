name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check code style
        run: mvn -B -ntp checkstyle:check

      - name: Build sources
        run: mvn -B -ntp -DskipTests compile

      - name: Scan dependencies for vulnerabilities
        if: ${{ secrets.NVD_API_KEY != '' }}
        run: mvn -B -ntp org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 -DnvdApiKey=${{ secrets.NVD_API_KEY }}

      - name: Skip vulnerability scan (missing NVD key)
        if: ${{ secrets.NVD_API_KEY == '' }}
        run: echo "::warning::NVD_API_KEY is not configured. Skipping dependency vulnerability scan to avoid very long CI runs."